<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Task Organizer</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <style> 
        body { 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold; 
            background: linear-gradient(135deg, #ff7f50, #ffb6c1);
            
            padding: 40px 20px;
            color: #333;
        } 
        
        h2 {
            font-weight: 800;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
            margin-bottom: 40px;
        }

        .img-container {
            display: flex;
            justify-content: center;
            gap: 20px;
          
            margin-bottom: 40px;
        }

        .img-container img {
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
          
        }

        .img-container img:hover {
            transform: translateY(-5px);
        }

        .card {
            max-width: 600px;
            margin: 20px auto;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            padding: 24px;
            font-size: 1.1rem;
          
        }
    </style> 
</head> 
<body> 
        
    <h2>My Daily Task Organizer!</h2> 

    <div class="img-container">
        <img src="https://www.shutterstock.com/image-vector/team-project-management-process-showing-260nw-2810092203.jpg" height="250" width="330" alt="Management Process"> 
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXNChvqPVmRH6Fp3jkYi6MWbfzbd7to5iGv1m-76bLlBXR2rKrRGuEYj0&s" height="250" width="330" alt="Task Checklist"> 
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzUrK73G9_92QHuhz5umenKAnIkVZB5p3Tmt771KKiQQ&s" height="250" width="330" alt="Productivity Habits"> 
    </div> 

    <div id="atoz" class="card container bg-primary text-light">

    </div> 
    
    <div id="mosttoleast" class="card container bg-danger text-light">

    </div> 

    <script> 
        var tasks = ['Complete My Homework','Read My Storybook','Clean My Room','Study Maths','Practice Coding']; 
        r = tasks.sort(); 
        document.getElementById("atoz").innerHTML = "<caption><h3><strong>My Daily Tasks!</strong></h3></caption>"+tasks+"<br>"+r; 
        
        let taska = ['Complete My Homework','Read My Storybook','Clean My Room','Study Maths','Practice Coding']; 
        taska.sort(); 
        let taskd = ['Complete My Homework','Read My Storybook','Clean My Room','Study Maths','Practice Coding']; 
        taskd.sort(); 
        taskd.reverse(); 
        document.getElementById("mosttoleast").innerHTML = "<caption><h3><strong>My Daily Tasks In Reverse Order!</strong></h3></caption>"+taska+"<br>"+taskd; 
    </script> 






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
